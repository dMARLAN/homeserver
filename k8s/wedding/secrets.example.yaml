apiVersion: v1
kind: Secret
metadata:
  name: wedding-frontend-secrets
  namespace: wedding
type: Opaque
stringData:
  # openssl rand -base64 32
  AUTH_SECRET: "change-me"
  ADMIN_PASSWORD: "change-me"
  # Must match ADMIN_AUTH_JWT_SECRET in wedding-api-secrets below.
  ADMIN_AUTH_JWT_SECRET: "change-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: wedding-api-secrets
  namespace: wedding
type: Opaque
stringData:
  ADMIN_AUTH_JWT_SECRET: "change-me"
  DB_PASSWORD: "change-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: wedding-postgres-secrets
  namespace: wedding
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: wedding-mail-secrets
  namespace: wedding
type: Opaque
stringData:
  # DKIM private key, mounted by mail/deployment.yaml as
  # /etc/opendkim/keys/chadandjanina.wedding.private. Paste the full PEM from
  # mail/keys/chadandjanina.wedding.private, indented under the block scalar, or generate it:
  #   kubectl --context homeserver create secret generic wedding-mail-secrets -n wedding \
  #     --dry-run=client -o yaml \
  #     --from-file=chadandjanina.wedding.private=mail/keys/chadandjanina.wedding.private
  chadandjanina.wedding.private: |
    -----BEGIN PRIVATE KEY-----
    change-me
    -----END PRIVATE KEY-----
  # Only read when RELAYHOST in mail/configmap.yaml is non-empty (smarthost fallback); delete
  # both keys otherwise. Both must be set for the entrypoint to enable SASL AUTH.
  # RELAYHOST_USERNAME: "change-me"
  # RELAYHOST_PASSWORD: "change-me"
